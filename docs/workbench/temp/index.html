function renderRecords(){let entries=state.records.filter(r=>([r.name,r.composition,r.family,r.origin].join(' ')).toLowerCase().includes(search.toLowerCase()));let totals={all:state.records.length,validated:state.records.filter(r=>r.status==='已核验').length,governance:state.records.filter(r=>r.status==='待治理'||r.status==='待核验').length};return `<div class="grid cols3" style="margin-bottom:17px"><div class="panel stat"><div class="slabel">样本记录</div><div class="num blue">${totals.all}</div><div class="note">文献 + 自有实验（仅已录入）</div></div><div class="panel stat"><div class="slabel">已核验</div><div class="num green">${totals.validated}</div><div class="note">已核对来源和单位</div></div><div class="panel stat"><div class="slabel">待治理/核验</div><div class="num">${totals.governance}</div><div class="note">不直接用于模型验证</div></div></div><div class="toolbar"><input type="search" id="search" placeholder="搜索催化剂名称、组成、材料体系" value="${e(search)}" /><button class="btn primary" data-add="records">＋ 录入样本</button><button class="btn" data-action="csv-import">导入样本CSV</button><button class="btn" data-action="csv-template">下载CSV模板</button></div><div class="notice">不同文献的温度、压力、空速和进料组成不应默认归一换算。建议保留原始工况为模型输入特征，并标记<strong>是否在可比条件下测试</strong>。原始来源、单位和计量基准缺失的样本不要直接标为已核验。</div>${table(['样本 / 体系','来源与可追溯','合成方式','测试工况 T/P/GHSV','性能 CO₂转化率 / MeOH选择性','治理','操作'],entries.map(r=>`<tr><td><b>${e(r.name)}</b><div class="small-top">${short(r.composition,35)}</div></td><td>${e(r.origin)}<div class="small-top" title="${e(srcName(r.sourceId))}">${e(r.sourceId||'无来源')}</div></td><td>${val(r.method)}</td><td>${val(r.temp)} ℃ / ${val(r.pressure)} bar<br><span class="small muted">${val(r.ghsv)} h⁻¹</span></td><td>${val(r.conv)} % / ${val(r.sel)} %<div class="small-top">STY ${val(r.sty)}</div></td><td>${badge(r.status)}</td><td>${button('编辑','edit-record',r.id)} ${button('删除','remove-record',r.id,'danger')}</td></tr>`))}`}

function renderScreening(){return `<div class="toolbar"><button class="btn primary" data-add="screenings">＋ 新增虚拟筛选运行</button><button class="btn" data-page="candidates">查看候选配方</button></div><div class="notice">本页面是<strong>筛选运行台账</strong>，不会自动执行算法。筛选结果必须保存模型版本、搜索空间、约束和输出文件来源。没有运行证据时不生成“最佳配方”。</div>${state.screenings.length?table(['运行ID/模型','搜索空间与目标','可行性约束','结果摘要','状态/来源','操作'],state.screenings.map(x=>`<tr><td><b>${e(x.name)}</b><div class="small-top">${val(x.modelId)}</div></td><td>${short(x.space,65)}<div class="small-top">${short(x.objective,50)}</div></td><td>${short(x.constraints,60)}</td><td>${short(x.summary,100)||'未提供'}</td><td>${badge(x.status)}<div class="small-top">${val(x.evidence)}</div></td><td>${button('编辑','edit-screening',x.id)} ${button('删除','remove-screening',x.id,'danger')}</td></tr>`)):panel('虚拟筛选记录为空','暂无模型预测、优化搜索或筛选结果',empty('尚未执行并记录任何虚拟筛选。'))}<div class="section-title"><h2>候选推荐最低要求</h2></div><div class="small-cards">${[['预测层','模型版本、测试工况、性能预测和不确定度'],['制造层','原料配方、制备路线、设备约束与安全边界'],['决策层','基准对照、多样性、实验槽位与验证条件']].map((x,i)=>`<div class="tinycard"><div class="kicker">${'0'+(i+1)}</div><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div>`}

}
const prev=state[kind].findIndex(x=>x.id===id);const idnew=id||uid(({sources:'SRC',records:'CAT',fields:'F',governance:'G',models:'ML',screenings:'VS',candidates:'CAN',roadmap:'T',issues:'Q',experiments:'EXP'})[kind]);const updated={...object,...parsed,id:idnew};if(prev>=0)state[kind][prev]=updated;else state[kind].push(updated);save();closeModal();render()});}
function openBatch(id='',initialIds=[]){const existing=state.batches.find(b=>b.id===id)||{};const selectedIds=id?existing.candidateIds:initialIds;openModal((id?'编辑':'创建')+'实验批次',`<div class="full"><label class="field-label">批次名称 *</label><input name="name" type="text" required value="${e(existing.name||'')}" /></div><div><label class="field-label">实验日期</label><input name="date" type="date" value="${e(existing.date||'')}"/></div><div><label class="field-label">排程状态</label><select name="status">${opts(['待安排','执行中','已完成','已暂停'],existing.status||'待安排')}</select></div><div class="full"><label class="field-label">批次候选（目前 ${state.candidates.length} 条候选，容量上限 ${state.settings.capacity}）</label><div class="mini-list" style="max-height:250px;overflow:auto">${state.candidates.map(c=>`<label class="mini-item" style="display:flex;gap:9px;align-items:center"><input type="checkbox" name="candidates" value="${e(c.id)}" ${selectedIds?.includes(c.id)?'checked':''} /><span>${e(c.name)} <span class="small muted">${e(c.composition)}</span></span></label>`).join('')||'<span class="small muted">请先在“候选配方对比”中建立候选。</span>'}</div></div><div class="full"><label class="field-label">批次说明 / 设备核准信息</label><textarea name="notes">${e(existing.notes||'')}</textarea></div>`,(form)=>{const cids=form.getAll('candidates');if(cids.length===0)return alert('请至少选择一个候选。');if(cids.length>state.settings.capacity)return alert(`已选择 ${cids.length} 个候选，超出当前计划上限 ${state.settings.capacity}；请拆分批次。`);const status=form.get('status');if(status==='执行中'){let other=state.batches.filter(b=>b.id!==id&&b.status==='执行中').reduce((sum,b)=>sum+b.candidateIds.length,0);if(other+cids.length>state.settings.capacity)return alert(`同时执行的测试槽位将达到 ${other+cids.length}，超过当前容量 ${state.settings.capacity}。`)}
const batch={id:id||uid('BAT'),name:String(form.get('name')).trim(),date:String(form.get('date')),status:String(status),candidateIds:cids,notes:String(form.get('notes')).trim()};const i=state.batches.findIndex(b=>b.id===id);if(i>=0)state.batches[i]=batch;else state.batches.push(batch);save();closeModal();selected.clear();page='experiments';render()});}
function deleteRecord(kind,id){const obj=state[kind].find(x=>x.id===id);if(!obj)return;
const references=[];
if(kind==='sources'){for(const k of ['records','roadmap','governance','models','screenings','candidates','experiments','issues'])if(state[k].some(x=>x.sourceId===id||x.evidence===id))references.push(k)}
if(kind==='candidates'&&(state.experiments.some(x=>x.candidateId===id)||state.batches.some(x=>x.candidateIds.includes(id))))references.push('实验记录/批次');
if(kind==='models'&&(state.screenings.some(x=>x.modelId===id)||state.experiments.some(x=>x.modelId===id)))references.push('筛选或回灌记录');
if(kind==='screenings'&&state.candidates.some(x=>x.screeningId===id))references.push('候选配方');
if(kind==='batches'&&state.experiments.some(x=>x.batchId===id))references.push('实验结果');
if(references.length)return alert('此记录仍被以下资料引用，不能直接删除：'+references.join('、')+'。请先解除关联。');
if(!confirm('确定删除该条记录？此操作可通过历史 JSON 备份恢复，但无法撤销。'))return;
state[kind]=state[kind].filter(x=>x.id!==id);selected.delete(id);save();render();}
function download(filename,text,mime='application/json;charset=utf-8'){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('AI_CO2_MeOH_Catalyst_Project_backup_'+now()+'.json',JSON.stringify(state,null,2))}
function csvCell(x){const str=String(x??'');return /[",\n\r]/.test(str)?'"'+str.replace(/"/g,'""')+'"':str}
function csvTemplate(){download('catalyst_data_import_template.csv',RECORD_COLS.filter(x=>x!=='extras').join(',')+'\r\n','text/csv;charset=utf-8')}
function parseCSV(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch;}else{if(ch==='"')quoted=true;else if(ch===','){row.push(field);field=''}else if(ch==='\n'){row.push(field.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=ch;}}row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(quoted)throw Error('CSV 未闭合的引号');return rows}
function importCSV(file){const reader=new FileReader();reader.onload=()=>{try{const rows=parseCSV(String(reader.result).replace(/^\uFEFF/,''));if(rows.length<2)return alert('CSV 中没有数据行。');const headers=rows[0].map(x=>x.trim());if(!headers.includes('name')||!headers.includes('sourceId'))return alert('CSV 必须包含 name 和 sourceId 列，以确保名称及来源可追溯。');let invalid=0,added=0,dupe=0;for(const values of rows.slice(1)){const raw=Object.fromEntries(headers.map((h,i)=>[h,values[i]??'']));if(!raw.name||!haveSource(raw.sourceId)){invalid++;continue}const dup=state.records.some(x=>x.name===raw.name&&x.sourceId===raw.sourceId&&String(x.temp)===String(raw.temp||'')&&String(x.pressure)===String(raw.pressure||''));if(dup){dupe++;continue}const rec={id:uid('CAT'),name:raw.name,origin:['文献数据','自有实验'].includes(raw.origin)?raw.origin:'来源未核定',sourceId:raw.sourceId,status:'待治理',extras:{}};for(const key of RECORD_COLS){if(['id','name','sourceId','origin','status','extras'].includes(key))continue;if(raw[key]!==undefined)rec[key]=['calcination','temp','pressure','ghsv','conv','sel','sty','replicates'].includes(key)&&raw[key]!==''?Number(raw[key]):raw[key]};state.records.push(rec);added++}if(added)save();render();alert(`导入完成：新增 ${added} 条（全部设为待治理）；跳过无来源/名称 ${invalid} 条，疑似重复 ${dupe} 条。`)}catch(err){alert('CSV解析失败：'+err.message)}};reader.readAsText(file,'utf-8')}
function importJSON(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);const ks=['sources','records','fields','governance','models','screenings','candidates','batches','experiments','roadmap','issues'];if(d.version!==1||!ks.every(k=>Array.isArray(d[k]))||!d.settings||!['4','5','6'].includes(String(d.settings.capacity)))throw Error('JSON版本或结构不兼容');if(!confirm('将用导入文件覆盖当前所有本地记录。建议先导出当前备份。确认继续？'))return;state=d;applyWorkbenchV11();save();selected.clear();search='';page='overview';render();alert('已导入备份。历史记录已保留，并应用工作台v1.1的增量资料索引。')}catch(err){alert('导入失败：'+err.message)}};reader.readAsText(file,'utf-8')}
function setCapacity(value){const c=Number(value);if(![4,5,6].includes(c))return;const active=state.batches.filter(b=>b.status==='执行中').reduce((t,b)=>t+b.candidateIds.length,0);const maxBatch=Math.max(0,...state.batches.map(b=>b.candidateIds.length));if(Math.max(active,maxBatch)>c){alert(`当前有执行中占用 ${active} 槽、最大单批 ${maxBatch} 个，无法将上限降到 ${c}。`);render();return;}state.settings.capacity=c;save();render()}
const actionMap={
'edit-source':['sources'],'remove-source':['sources'],
'edit-record':['records'],'remove-record':['records'],
'edit-field':['fields'],'remove-field':['fields'],
'edit-governance':['governance'],
'edit-model':['models'],'remove-model':['models'],
'edit-screening':['screenings'],'remove-screening':['screenings'],
'edit-candidate':['candidates'],'remove-candidate':['candidates'],
'edit-experiment':['experiments'],'remove-experiment':['experiments'],
'edit-task':['roadmap'],'remove-task':['roadmap'],
'edit-issue':['issues'],
'edit-batch':['batches'],'remove-batch':['batches']
};
document.getElementById('nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-page]');if(!b)return;page=b.dataset.page;search='';selected.clear();render();window.scrollTo({top:0,behavior:'auto'})});
document.getElementById('view').addEventListener('click',ev=>{
const add=ev.target.closest('[data-add]');if(add)return openEditor(add.dataset.add);
const go=ev.target.closest('[data-page]');if(go){page=go.dataset.page;search='';render();return}
const cat=ev.target.closest('[data-field-cat]');if(cat){fieldCategory=cat.dataset.fieldCat;render();return}
const button=ev.target.closest('[data-action]');if(!button)return;const {action,id}=button.dataset;
if(actionMap[action]){const k=actionMap[action][0];if(action.startsWith('edit-'))return k==='batches'?openBatch(id):openEditor(k,id);if(action.startsWith('remove-'))return deleteRecord(k,id)}
if(action==='csv-template')return csvTemplate();if(action==='csv-import')return document.getElementById('csv-file').click();if(action==='export-json')return exportJSON();if(action==='import-json')return document.getElementById('import-file').click();
if(action==='clear-selection'){selected.clear();render();return}if(action==='new-batch')return openBatch();if(action==='batch-from-selected')return openBatch('',[...selected]);
if(action==='compare'){if(selected.size<2)alert('请选择至少两个候选以比较。');else if(selected.size>6)alert('对照建议最多选择6个；请缩小范围。');else document.querySelector('#comparison-table')?.scrollIntoView({behavior:'smooth',block:'start'});return}
});
document.getElementById('view').addEventListener('change',ev=>{if(ev.target.id==='capacity'){setCapacity(ev.target.value);return}if(ev.target.id==='candidate-filter'){candidateFilter=ev.target.value;render();return}if(ev.target.id==='candidate-sort'){candidateSort=ev.target.value;render();return}if(ev.target.dataset.selectCandidate){const id=ev.target.dataset.selectCandidate;if(ev.target.checked)selected.add(id);else selected.delete(id);render();return}});
document.getElementById('view').addEventListener('input',ev=>{if(ev.target.id==='search'){const p=ev.target.selectionStart;search=ev.target.value;render();const field=document.getElementById('search');if(field){field.focus();field.setSelectionRange(p,p)}}});
document.getElementById('export-top').onclick=exportJSON;document.getElementById('quick-add').onclick=()=>openEditor(({sources:'sources',records:'records',fields:'fields',models:'models',screening:'screenings',candidates:'candidates',experiments:'experiments',roadmap:'roadmap'})[page]||'sources');
document.getElementById('import-file').onchange=ev=>{if(ev.target.files?.[0])importJSON(ev.target.files[0]);ev.target.value=''};
document.getElementById('csv-file').onchange=ev=>{if(ev.target.files?.[0])importCSV(ev.target.files[0]);ev.target.value=''};
window.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
render();
</script>
</body></html>
