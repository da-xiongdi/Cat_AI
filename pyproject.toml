[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "catalyst-ai"
version = "0.1.0"
description = "Traceable CO2 hydrogenation catalyst data contracts and governance"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "SQLAlchemy>=2.0.36,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
snapshots = ["pandas>=2.2,<4", "pyarrow>=19,<24"]
modeling = [
    "scikit-learn>=1.7,<2",
]
explain = [
    "shap>=0.49,<1",
]

[project.scripts]
catalyst-ai = "catalyst_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
